[package]
name = "libre-ai-harness"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "EUPL-1.2"
repository = "https://github.com/libre-ai/execution-sandbox"
publish = false

[dependencies]
ed25519-dalek = "=3.0.0"
libre-ai-contract-types = { version = "=0.1.0", git = "https://github.com/libre-ai/schemas-and-contracts", rev = "a82d7b54cfda00bfcbbdff34a3c34f24a2468a6e" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_jcs = "=0.2.0"
serde_json = { version = "=1.0.151", features = ["float_roundtrip"] }
sha2 = { version = "=0.11.0", default-features = false }

[workspace]
